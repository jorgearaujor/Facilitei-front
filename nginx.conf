limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=registration_limit:10m rate=5r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://api-facilitei:8080/api/auth/login;
        include /etc/nginx/proxy_params;
    }

    location = /api/clientes {
        limit_req zone=registration_limit burst=2 nodelay;
        proxy_pass http://api-facilitei:8080/api/clientes;
        include /etc/nginx/proxy_params;
    }

    location = /api/trabalhadores {
        limit_req zone=registration_limit burst=2 nodelay;
        proxy_pass http://api-facilitei:8080/api/trabalhadores;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://api-facilitei:8080/api/;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /buildrun-livechat-websocket {
        proxy_pass http://api-facilitei:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
